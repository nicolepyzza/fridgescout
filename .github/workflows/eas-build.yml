name: EAS Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Submit to App Store
    runs-on: ubuntu-latest
    # Only run on commits that update version (Release Please merges)
    if: contains(github.event.head_commit.message, 'chore(main): release')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: ^51.0.0
          eas-version: ^10.0.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build iOS app
        run: eas build --platform ios --profile production --non-interactive

      - name: Submit to App Store
        run: eas submit --platform ios --latest --non-interactive --apple-id "$EXPO_APPLE_ID" --apple-app-specific-password "$EXPO_APPLE_APP_SPECIFIC_PASSWORD"
        env:
          EXPO_APPLE_ID: ${{ secrets.APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
